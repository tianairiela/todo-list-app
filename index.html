<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="todo-app">
    <div class="todo-header">
      <h1>📝 Ma Todo List</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Changer de thème" title="Changer de thème">
        🌙
      </button>
    </div>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Ajouter une nouvelle tâche..."
        autocomplete="off"
        autofocus
        required
      />
      <input
        type="date"
        id="todo-date-input"
        class="todo-date-input"
        aria-label="Date d'échéance (optionnelle)"
        title="Date d'échéance (optionnelle)"
      />
      <button type="submit">Ajouter</button>
    </form>

    <div class="search-bar">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="🔍 Rechercher une tâche..."
        aria-label="Rechercher une tâche"
        autocomplete="off"
      />
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes</button>
      <button class="filter-btn" data-filter="active">En cours</button>
      <button class="filter-btn" data-filter="completed">Terminées</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="todo-footer">
      <span id="todo-count">0 tâche(s) restante(s)</span>
      <button id="clear-completed">Supprimer les terminées</button>
    </footer>

    <div class="data-actions">
      <button id="export-btn" type="button" title="Exporter les tâches dans un fichier JSON">
        ⬇️ Exporter
      </button>
      <label class="import-label" for="import-input" title="Importer des tâches depuis un fichier JSON">
        ⬆️ Importer
        <input type="file" id="import-input" accept="application/json" hidden />
      </label>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
