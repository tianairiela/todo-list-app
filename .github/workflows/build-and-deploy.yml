name: 'Build and deploy tianairiela/todo-list-app'
'on':
  push:
    branches:
      - '**'
  delete: null
permissions:
  contents: read
jobs:
  preview:
    if: "github.event_name == 'push' && !github.event.deleted && github.ref_name != 'main'"
    runs-on:
      - self-hosted
      - tianairiela/todo-list-app
    concurrency:
      group: 'preview-${{ github.ref_name }}'
      cancel-in-progress: false
    steps:
      - name: 'Deploy the preview'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'if [ -f "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" ]; then printf ''%s\n'' "$GITHUB_TOKEN" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" | bash "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" preview; else echo "~/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh absent : connectez-vous au serveur depuis EVA Pilote, rien n''est déployé."; fi'
  production:
    if: "github.event_name == 'push' && !github.event.deleted && github.ref_name == 'main'"
    runs-on:
      - self-hosted
      - tianairiela/todo-list-app
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: 'Deploy the production'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: 'if [ -f "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" ]; then printf ''%s\n'' "$GITHUB_TOKEN" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" | bash "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" production; else echo "~/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh absent : connectez-vous au serveur depuis EVA Pilote, rien n''est déployé."; fi'
  remove-preview:
    if: "github.event_name == 'delete' && github.event.ref_type == 'branch'"
    runs-on:
      - self-hosted
      - tianairiela/todo-list-app
    concurrency:
      group: 'preview-${{ github.event.ref }}'
      cancel-in-progress: false
    steps:
      - name: 'Remove the preview'
        env:
          DELETED_BRANCH: '${{ github.event.ref }}'
        run: 'if [ -f "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" ]; then printf ''%s\n'' "" "$GITHUB_REPOSITORY" "$DELETED_BRANCH" "" | bash "$HOME/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh" remove-preview; else echo "~/deployment/preprodweb.ia-souveraine.fr/scripts/deploy.sh absent : connectez-vous au serveur depuis EVA Pilote, rien n''est déployé."; fi'
